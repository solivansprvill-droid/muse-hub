<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0d1017" />
  <title>Muse</title>
  <link rel="icon" href="/img/avatar.svg" />
  <link rel="stylesheet" href="/css/app.css" />
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="btnMenu" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="avatar" id="btnAvatar" aria-label="Muse"><img src="/img/avatar.svg" alt="Muse" /></button>
      <button class="icon-btn" id="btnMore" aria-label="更多">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>
      </button>
    </header>
    <div class="more-menu hidden" id="moreMenu">
      <button data-act="refresh">刷新当前页</button>
      <button data-act="settings">设置</button>
      <button data-act="about">关于 Muse</button>
    </div>

    <aside class="drawer" id="drawer">
      <div class="drawer-inner">
        <div class="drawer-title">Muse</div>
        <div class="drawer-scroll">
          <div class="drawer-sec">选项卡</div>
          <nav id="navTabs"></nav>
          <div class="drawer-sec">空间</div>
          <nav id="navSpaces"></nav>
        </div>
        <div class="drawer-foot">
          <button class="icon-btn sm" id="btnSettings" aria-label="设置">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <input class="drawer-search" id="drawerSearch" placeholder="搜索" />
          <button class="icon-btn sm" id="btnCompose" aria-label="新对话">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main id="view"></main>
    <div class="loader hidden" id="loader"><div class="spinner"></div></div>
    <div class="toast hidden" id="toast"></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
